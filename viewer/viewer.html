<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holy Bible — Berea Edition</title>
<style>
:root{
  --bg:#faf9f6; --txt:#2b2620; --panel:#f3efe6; --edge:#e0d6c2; --accent:#8a6d3b;
  --c-ot:#ffe9a8; --c-fathers:#d6e9ff; --c-rcdoctors:#ffd9e8; --c-wright:#d9f2d9;
  --c-calvin:#eadcff; --c-luther:#ffe0cc; --serif:Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--serif)}
header{padding:20px 36px 10px;border-bottom:1px solid var(--edge);display:flex;align-items:baseline;gap:14px}
header h1{font-size:24px;margin:0}
header .ed{font:12px -apple-system,sans-serif;color:#8a7a66}
#main{display:flex;min-height:calc(100vh - 62px)}
#content{flex:1;padding:22px 34px;max-width:840px;overflow-y:auto}
#layers{width:250px;background:var(--panel);border-left:1px solid var(--edge);padding:18px 16px;
  font:13px/1.5 -apple-system,sans-serif;position:sticky;top:0;height:calc(100vh - 62px);overflow-y:auto;display:none}
#layers.active{display:block}
#layers h2{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#8a7a66;margin:0 0 10px}
button.layer{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;
  border:none;border-radius:8px;padding:8px 10px;margin-bottom:4px;cursor:pointer;font:13px -apple-system,sans-serif;color:var(--txt)}
button.layer:hover{background:#e8e0cf}
button.layer .check{width:15px;height:15px;flex:none;color:#4a7c2f;font-weight:bold;visibility:hidden}
button.layer.on .check{visibility:visible}
button.layer .sw{width:15px;height:15px;border-radius:4px;flex:none;border:1px solid #00000018}
button.layer .count{margin-left:auto;color:#a2937d;font-size:11px}
#citedetail{margin-top:14px;border-top:1px solid var(--edge);padding-top:10px;font-size:12px;color:#5a4632}
.citem{background:#fff;border:1px solid var(--edge);border-radius:6px;padding:7px 9px;margin-bottom:6px}
.citem .goto{color:#8a6d3b;font-size:11px;text-decoration:none}
/* books grid */
.bookcols{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}
.bookcols h2{font-size:15px;color:var(--accent);margin:18px 0 6px}
ul.books{list-style:none;padding:0;margin:0;columns:2;column-gap:26px}
ul.books li{margin:2px 0;break-inside:avoid}
ul.books a{color:var(--txt);text-decoration:none;font-size:15px;display:flex;justify-content:space-between}
ul.books a:hover{color:var(--accent)}
ul.books .n{color:#a2937d;font:11px -apple-system,sans-serif}
.chapters{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.chapters a{font:13px -apple-system,sans-serif;background:#efe6d3;color:#5a4632;padding:5px 10px;border-radius:5px;text-decoration:none}
.chapters a:hover{background:var(--accent);color:#fff}
mark.hl{border-radius:3px;padding:0 1px}
p.v{margin:0 0 9px;text-indent:1.4em;line-height:1.75}
sup.vnum{font:11px -apple-system,sans-serif;color:#a2937d;margin-right:4px}
.crumbs{font:12px/1.4 -apple-system,sans-serif;color:#8a7a66;margin-bottom:16px}
.crumbs a{color:var(--accent);text-decoration:none}
</style></head><body>
<header><h1>The Holy Bible</h1><span class="ed">Berea Edition — Berean Standard Bible · with citation layers</span></header>
<div id="main"><div id="content"></div>
<div id="layers"><h2>Citation layers</h2><div id="layerbuttons"></div><div id="citedetail"></div></div></div>
<script>
const LAYERS = [
  {key:"ot",label:"NT → OT"},{key:"fathers",label:"Church Fathers"},{key:"rcdoctors",label:"RC Doctors"},
  {key:"wright",label:"N.T. Wright"},{key:"calvin",label:"Calvin"},{key:"luther",label:"Luther"}];
const COLORS = {"ot":"#ffe9a8","fathers":"#d6e9ff","rcdoctors":"#ffd9e8","wright":"#d9f2d9","calvin":"#eadcff","luther":"#ffe0cc"};
const DARK = {"ot":"#8a6d00","fathers":"#1d4f91","rcdoctors":"#a3326e","wright":"#1e6b1e","calvin":"#4a2d8f","luther":"#b34a00"};
const state = {}; const order = [];
LAYERS.forEach(l => state[l.key] = false);

let BOOKS = {ot:[], nt:[]};       // [{book, chapters:[counts]}]
let CITATIONS = {}; let VERSES = []; let CUR = null;

async function loadBooks(){
  for (const t of ["ot","nt"]){
    const r = await fetch(`/api/books/${t}`).then(r=>r.json());
    BOOKS[t] = r.books;
  }
}
function nav(h){ location.hash = h; }

function route(){
  const h = location.hash.slice(1); // e.g. /nt/John/1
  const parts = h.split("/").filter(Boolean);
  if (parts.length === 0) return renderHome();
  if (parts.length === 2) return renderBook(parts[0], parts[1]);
  if (parts.length === 3) return renderChapter(parts[0], parts[1], parseInt(parts[2]));
  renderHome();
}

function renderHome(){
  document.getElementById("layers").classList.remove("active");
  const el = document.getElementById("content");
  el.innerHTML = `<div class="bookcols">
    <div><h2>Old Testament</h2><ul class="books">${BOOKS.ot.map(b =>
      `<li><a href="#/ot/${encodeURIComponent(b.book)}/">${b.book}<span class="n">${b.chapters}</span></a></li>`).join("")}</ul></div>
    <div><h2>New Testament</h2><ul class="books">${BOOKS.nt.map(b =>
      `<li><a href="#/nt/${encodeURIComponent(b.book)}/">${b.book}<span class="n">${b.chapters}</span></a></li>`).join("")}</ul></div>
  </div>`;
}

function renderBook(t, book){
  document.getElementById("layers").classList.remove("active");
  const b = BOOKS[t].find(x => x.book === book) || {chapters:0};
  const el = document.getElementById("content");
  let chs = "";
  el.innerHTML = `<div class="crumbs"><a href="#">${t==='ot'?'Old':'New'} Testament</a> / ${book}</div>
    <h1 style="font-size:22px;margin:0 0 8px">${book}</h1>
    <div class="chapters" id="chlist"></div>`;
  fetch(`/api/books/${t}`).then(r=>r.json()).then(all => {
    const bb = all.books.find(x=>x.book===book);
    const n = bb ? bb.chapters : 0;
    document.getElementById("chlist").innerHTML =
      Array.from({length:n},(_,i)=>`<a href="#/${t}/${encodeURIComponent(book)}/${i+1}">${i+1}</a>`).join("");
  });
}

async function renderChapter(t, book, chap){
  CUR = {t, book, chap};
  document.getElementById("layers").classList.add("active");
  const [chapData, cites] = await Promise.all([
    fetch(`/api/chapter/${t}/${encodeURIComponent(book)}/${chap}`).then(r=>r.json()),
    fetch(`/api/citations/${t}/${encodeURIComponent(book)}/${chap}`).then(r=>r.json())
  ]);
  VERSES = chapData.verses; CITATIONS = cites;
  const el = document.getElementById("content");
  el.innerHTML = `<div class="crumbs"><a href="#">${t==='ot'?'Old':'New'} Testament</a> /
    <a href="#/${t}/${encodeURIComponent(book)}/">${book}</a> / ${chap}</div>
    <h1 style="font-size:22px;margin:0 0 12px">${book} ${chap}</h1><div id="text"></div>`;
  renderButtons(); renderText();
}

function renderButtons(){
  const el = document.getElementById("layerbuttons");
  el.innerHTML = "";
  for (const L of LAYERS){
    const n = (CITATIONS[L.key]||[]).length;
    const b = document.createElement("button");
    b.className = "layer" + (state[L.key] ? " on" : "");
    b.innerHTML = `<span class="check">✓</span><span class="sw" style="background:${COLORS[L.key]}"></span>
      <span>${L.label}</span><span class="count">${n||""}</span>`;
    b.onclick = () => {
      if (!state[L.key]) {
        if (order.length >= 3) { const drop = order.shift(); state[drop] = false; }
        order.push(L.key); state[L.key] = true;
      } else { state[L.key] = false; const i = order.indexOf(L.key); if (i >= 0) order.splice(i,1); }
      renderButtons(); renderText();
    };
    el.appendChild(b);
  }
}

function renderText(){
  const el = document.getElementById("text");
  el.innerHTML = "";
  const onActive = order.filter(k => (CITATIONS[k]||[]).length);
  for (const v of VERSES){
    const p = document.createElement("p");
    p.className = "v";
    p.innerHTML = `<sup class="vnum">${v.v}</sup>`;
    const onCite = onActive.filter(k => (CITATIONS[k]||[]).some(c => c.verse === v.v));
    if (onCite.length){
      const bgc = COLORS[onCite[0]];
      const txtc = onCite.length > 1 ? DARK[onCite[1]] : '';
      const stripes = onCite.slice(2);
      const shadow = stripes.length ? `box-shadow:${stripes.map((k,i)=>`inset -${5*(i+1)}px 0 0 ${COLORS[k]}`).join(',')};` : '';
      p.innerHTML += `<mark class="hl" style="background:${bgc};${txtc?`color:${txtc};font-weight:600;`:''}${shadow}">${v.text}</mark>`;
      p.style.cursor = "pointer";
      p.onclick = () => showDetail(v.v);
    } else p.innerHTML += v.text;
    el.appendChild(p);
  }
}

function showDetail(v){
  const el = document.getElementById("citedetail");
  const all = [];
  for (const k of order){
    for (const c of (CITATIONS[k]||[])) if (c.verse === v) all.push({layer:k, ...c});
  }
  el.innerHTML = `<h2 style="font-size:12px;margin:0 0 8px">${CUR.book} ${CUR.chap}:${v} — ${all.length} citation${all.length>1?'s':''}</h2>`;
  for (const c of all){
    const d = document.createElement("div");
    d.className = "citem"; d.style.borderLeft = `3px solid ${COLORS[c.layer]}`;
    const ym = (c.text||"").match(/https:\/\/youtu\.be\/([A-Za-z0-9_-]{11})/);
    d.innerHTML = `<b style="color:${DARK[c.layer]}">${c.who||c.layer}</b> ${c.text.slice(0,130)}<br>
      ${ym?`<a class="goto" target="_blank" href="https://www.youtube.com/watch?v=${ym[1]}">watch the video ▶</a>`:''}
      ${c.src?` <a class="goto" target="_blank" href="${c.src}">source →</a>`:''}`;
    el.appendChild(d);
  }
}

window.addEventListener("hashchange", route);
loadBooks().then(route);
</script></body></html>
