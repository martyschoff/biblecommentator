<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Testament — Berea Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== design system: one palette, two typefaces, generous space ===== */
:root{
  --bg:#fbf9f4; --ink:#211d16; --ink-2:#6b6154; --ink-3:#a09483;
  --accent:#7c5f2e; --accent-soft:#f2e9d8; --panel:#f6f1e7; --edge:#e8e0d0;
  --ot-bg:#fdeeb6;  --ot-tx:#7a5c00;
  --fa-bg:#dbeafe;  --fa-tx:#1e4e8c;
  --rc-bg:#fbdce8;  --rc-tx:#97275e;
  --wr-bg:#d9f2d9;  --wr-tx:#20691f;
  --ca-bg:#e6dcfc;  --ca-tx:#46297f;
  --lu-bg:#ffe3cc;  --lu-tx:#a34a00;
  --sans:'Inter',-apple-system,sans-serif;
  --serif:'EB Garamond',Georgia,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:18px}

/* sticky header: quiet brand + breadcrumb right */
header{position:sticky;top:0;z-index:10;background:rgba(251,249,244,.93);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--edge);padding:13px 40px;display:flex;align-items:center;gap:16px}
header .brand{font:600 17px var(--sans);color:var(--ink);letter-spacing:-.2px}
header .brand em{font-style:normal;color:var(--accent)}
header .ed{font:400 12.5px var(--sans);color:var(--ink-3)}
header .crumb{margin-left:auto;font:500 13px var(--sans);color:var(--ink-2)}
header .crumb a{color:var(--accent);text-decoration:none;font-weight:600}
header .crumb a:hover{text-decoration:underline}

#main{display:flex;align-items:flex-start}
#content{flex:1;padding:34px 48px 90px;max-width:800px}
#content h1{font:600 34px/1.15 var(--sans);letter-spacing:-.5px;margin:0 0 6px}
#content h1 .chap{color:var(--ink-3);font-weight:500}
.lede{font:400 14px var(--sans);color:var(--ink-2);margin:0 0 24px}
.section-label{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-3);margin:22px 0 10px}

.passagecard{background:var(--accent-soft);border:1px solid var(--edge);border-radius:8px;
  padding:10px 12px;margin-top:8px}
.passagehead{font:600 10.5px var(--sans);color:var(--ink-3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.passagesnippet{font:400 15px var(--serif);line-height:1.7;color:var(--ink);margin-bottom:8px}
.passagesnippet mark{background:#f5d97a;padding:0 2px;border-radius:3px}
.hero{position:relative;min-height:320px;border-radius:12px;overflow:hidden;margin:-34px -48px 30px;
  display:flex;align-items:center}
.hero-art{position:absolute;inset:0;background:url("/piero_baptism.jpg") right center / contain no-repeat}
.hero-fade{position:absolute;inset:0;
  background:linear-gradient(90deg, var(--bg) 0%, rgba(251,249,244,.96) 30%, rgba(251,249,244,.75) 46%, rgba(251,249,244,0) 72%)}
.hero-text{position:relative;padding:60px 40px 60px 48px;max-width:520px}
.hero-kicker{font:600 11px var(--sans);letter-spacing:1.6px;color:var(--accent);margin-bottom:12px}
.hero-title{font:600 46px/1.05 var(--sans);letter-spacing:-1px;margin:0 0 10px;color:var(--ink)}
.hero-attr{font:400 13.5px var(--serif);font-style:italic;color:var(--ink-2);margin-bottom:14px}
.hero-blurb{font:400 15px/1.65 var(--sans);color:var(--ink-2);max-width:400px}
/* books: two columns, touch-target rows, hover wash */
ul.books{list-style:none;padding:0;margin:0;columns:2;column-gap:44px}
ul.books li{break-inside:avoid;margin:0 0 2px}
ul.books a{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:16.5px;transition:background .12s}
ul.books a:hover{background:var(--accent-soft)}
ul.books .n{font:500 12px var(--sans);color:var(--ink-3)}

/* chapter tiles */
.chapters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chapters a{font:500 14px var(--sans);min-width:44px;text-align:center;padding:9px 0;
  background:#fff;border:1px solid var(--edge);border-radius:8px;color:var(--ink);text-decoration:none;transition:all .12s}
.chapters a:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}

/* reading view */
p.v{margin:0 0 15px;text-indent:1.6em;line-height:1.85;font-size:19.5px}
sup.vnum{font:600 10.5px var(--sans);color:var(--accent);margin-right:5px;vertical-align:28%}
mark.hl{border-radius:4px;padding:1px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* layers panel */
#layers{width:280px;flex:none;background:var(--panel);border-left:1px solid var(--edge);
  padding:22px 18px;font-family:var(--sans);position:sticky;top:56px;height:calc(100vh - 56px);
  overflow-y:auto;display:none}
#layers.active{display:block}
#layers h2{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-3);margin:0 0 12px}
button.layer{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:#fff;border:1px solid var(--edge);border-radius:9px;padding:10px 12px;margin-bottom:7px;
  cursor:pointer;font:500 13.5px var(--sans);color:var(--ink);transition:all .12s}
button.layer:hover{border-color:var(--accent)}
button.layer.on{border-color:var(--accent);background:var(--accent-soft)}
button.layer .sw{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid #00000014}
button.layer .count{margin-left:auto;font:500 11px var(--sans);color:var(--ink-3)}
.hint{font:400 11px var(--sans);color:var(--ink-3);margin-top:10px;line-height:1.5}
select.drs{margin:0 0 7px;font:500 12px var(--sans);border:1px solid var(--edge);border-radius:6px;
  padding:5px 6px;background:#fff;color:var(--ink);width:100%}
#citedetail{margin-top:18px;border-top:1px solid var(--edge);padding-top:14px}
#citedetail h3{font:600 12px var(--sans);color:var(--ink-2);margin:0 0 10px}
.citem{background:#fff;border:1px solid var(--edge);border-radius:8px;padding:10px 12px;margin-bottom:8px;
  font-size:12.5px;line-height:1.55;color:var(--ink)}
.citem .who{font-weight:600}
.citem .goto{color:var(--accent);font-size:11.5px;font-weight:500;text-decoration:none}
.citem .goto:hover{text-decoration:underline}
</style></head>
<body>
<header>
  <span class="brand">Berea <em>·</em> New Testament</span>
  <span class="ed">Berean Standard Bible</span><span id="buildtag" style="font:500 10px var(--sans);color:var(--ink-3);border:1px solid var(--edge);border-radius:4px;padding:1px 5px">v4</span>
  <span class="crumb" id="crumb"></span>
</header>
<div id="main">
  <div id="content"></div>
  <div id="layers"><h2>Citation Layers</h2><div id="layerbuttons"></div><div id="citedetail"></div></div>
</div>
<script>
const LAYERS = [
  {key:"ot",label:"NT → OT"},{key:"fathers",label:"Church Fathers"},{key:"rcdoctors",label:"RC Doctors"},
  {key:"wright",label:"N.T. Wright"},{key:"calvin",label:"Calvin"},{key:"luther",label:"Luther"}];
const BG  = {"ot":"#fdeeb6","fathers":"#dbeafe","rcdoctors":"#fbdce8","wright":"#d9f2d9","calvin":"#e6dcfc","luther":"#ffe3cc"};
const TX  = {"ot":"#7a5c00","fathers":"#1e4e8c","rcdoctors":"#97275e","wright":"#20691f","calvin":"#46297f","luther":"#a34a00"};
const state = {}; const order = [];
LAYERS.forEach(l => state[l.key] = false);
const pickedDoctor = {value:"", layer:"rcdoctors"};   // attributor filter (value+owning layer)

let BOOKS = {nt:[]};
let CITATIONS = {}; let VERSES = []; let CUR = null;

async function loadBooks(){
  const r = await fetch(`/api/books/nt`).then(r=>r.json());
  BOOKS.nt = r.books;
}
function route(){
  const parts = location.hash.slice(1).split("/").filter(Boolean).map(decodeURIComponent);
  if (parts.length === 0) return renderHome();
  if (parts.length === 2) return renderBook(parts[0], parts[1]);
  if (parts.length === 3) return renderChapter(parts[0], parts[1], parseInt(parts[2]));
  renderHome();
}
function setCrumb(html){ document.getElementById("crumb").innerHTML = html; }

function renderHome(){
  document.getElementById("layers").classList.remove("active");
  setCrumb("");
  const el = document.getElementById("content");
  const CANON = ["Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians",
  "Galatians","Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians",
  "1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter",
  "1 John","2 John","3 John","Jude","Revelation"];
  const sorted = BOOKS.nt.slice().sort((a,b) => CANON.indexOf(a.book) - CANON.indexOf(b.book));
  el.innerHTML = `
    <div class="hero">
      <div class="hero-art" role="img" aria-label="The Baptism of Christ, Piero della Francesca"></div>
      <div class="hero-fade"></div>
      <div class="hero-text">
        <div class="hero-kicker">SACRED TEXT FOR DAILY READING</div>
        <h1 class="hero-title">New Testament</h1>
        <div class="hero-attr">The Baptism of Christ · Piero della Francesca · c. 1450</div>
        <div class="hero-blurb">Twenty-seven books of the Berean Standard Bible, read with the citation layers of the Church Fathers, the Reformers, and the Doctors.</div>
      </div>
    </div>
    <div class="section-label">Books</div>
    <ul class="books">${sorted.map(b =>
      `<li><a href="#/nt/${encodeURIComponent(b.book)}/">${b.book}<span class="n">${b.chapters} ch</span></a></li>`).join("")}</ul>`;
}

function renderBook(t, book){
  document.getElementById("layers").classList.remove("active");
  setCrumb(`<a href="#">NT</a> › ${book}`);
  const el = document.getElementById("content");
  el.innerHTML = `<h1>${book}</h1><div class="section-label">Chapters</div><div class="chapters" id="chlist"></div>`;
  const n = (BOOKS.nt.find(x=>x.book===book)||{}).chapters || 0;
  document.getElementById("chlist").innerHTML =
    Array.from({length:n},(_,i)=>`<a href="#/${t}/${encodeURIComponent(book)}/${i+1}">${i+1}</a>`).join("");
}

async function renderChapter(t, book, chap){
  CUR = {t, book, chap};
  document.getElementById("layers").classList.add("active");
  setCrumb(`<a href="#">NT</a> › <a href="#/${t}/${encodeURIComponent(book)}/">${book}</a> › ${chap}`);
  const [chapData, cites] = await Promise.all([
    fetch(`/api/chapter/${t}/${encodeURIComponent(book)}/${chap}`).then(r=>r.json()),
    fetch(`/api/citations/${t}/${encodeURIComponent(book)}/${chap}`).then(r=>r.json())
  ]);
  VERSES = chapData.verses; CITATIONS = cites;
  pickedDoctor.value = ""; pickedDoctor.layer = "rcdoctors";
  document.getElementById("content").innerHTML = `
    <h1>${book} <span class="chap">${chap}</span></h1>
    <div class="lede">select layers on the right — click a highlighted verse for its citations</div>
    <div id="text"></div>`;
  renderButtons(); renderText();
}

// display-name normalization for attributor variants/abbreviations
const NAME_FIX = {
  "Remig":"Remigius of Auxerre","Chrys":"Chrysostom","Pseudo-Chrys":"Pseudo-Chrysostom",
  "Raban":"Rabanus Maurus","Rabanus":"Rabanus Maurus","Pseudo-Jerome":"Pseudo-Jerome",
  "Thomas a Kempis":"Thomas à Kempis","Clement":"Clement of Alexandria",
  "Victorinus":"Marius Victorinus","Basil":"Basil the Great",
  "Gregory":"Gregory the Great","August":"Augustine"};
// RC Doctors: full canonical roster (in traditional importance order) — shown always
const RC_DOCTORS = ["Augustine","Jerome","Ambrose","Gregory the Great","Athanasius (eastern)",
  "Basil the Great","Gregory of Nazianzus","John Chrysostom","Thomas Aquinas","Bonaventure",
  "Anselm","Bernard of Clairvaux","Isidore of Seville","Peter Damian","Leo the Great",
  "Peter Chrysologus","Hilary of Poitiers","Cyril of Alexandria","Cyril of Jerusalem",
  "Ephrem the Syrian","John of Damascus","Bede the Venerable","Albert the Great",
  "Lawrence of Brindisi","Teresa of Ávila","Catherine of Siena","Robert Bellarmine",
  "Francis de Sales","Alphonsus Liguori","Jane Frances de Chantal","John Eudes",
  "Louis Grignion de Montfort","Anthony of Padua","Peter Canisius","Ephrem","Irenaeus","Maximilian Kolbe"];
// Church Fathers: top 20 by importance
const TOP_FATHERS = ["Augustine","Chrysostom","Jerome","Tertullian","Ambrose","Athanasius",
  "Irenaeus","Cyprian","Basil the Great","Origen","Gregory of Nyssa","Gregory the Great",
  "Cyril of Jerusalem","Leo the Great","Clement of Alexandria","Ignatius","Justin Martyr",
  "Hippolytus","Eusebius","Polycarp"];

function attributorsOf(key){
  const set = new Set();
  for (const c of (CITATIONS[key]||[])){
    const seg = (c.text||"").split(" | ")[1] || "";
    const m = seg.match(/^([\w' .-]+?)\s*(?:\(via|,|\s\(|:)/);
    if (m) set.add(NAME_FIX[m[1].trim()] || m[1].trim());
  }
  const found = [...set];
  if (key === "rcdoctors"){
    // always show the canonical roster (first 10 names), data or not
    return RC_DOCTORS.slice(0, 10);
  }
  if (key === "fathers"){
    const top = TOP_FATHERS.filter(f => found.includes(f));
    const rest = found.filter(f => !top.includes(f)).sort();
    return [...top, ...rest];
  }
  return found.sort();
}
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

function renderButtons(){
  const el = document.getElementById("layerbuttons");
  el.innerHTML = "";
  for (const L of LAYERS){
    const n = (CITATIONS[L.key]||[]).length;
    const b = document.createElement("button");
    b.className = "layer" + (state[L.key] ? " on" : "");
    b.innerHTML = `<span class="sw" style="background:${BG[L.key]}"></span><span>${L.label}</span>
      <span class="count">${n || ""}</span>`;
    b.onclick = () => {
      if (!state[L.key]) {
        if (order.length >= 3) { const drop = order.shift(); state[drop] = false; }
        order.push(L.key); state[L.key] = true;
      } else { state[L.key] = false; const i = order.indexOf(L.key); if (i >= 0) order.splice(i,1); }
      if (["rcdoctors","fathers"].includes(L.key) && !state[L.key] && pickedDoctor.layer === L.key) pickedDoctor.value = "";
      renderButtons(); renderText();
    };
    el.appendChild(b);
    // RC Doctors + Fathers: individual attributor dropdown when layer is on
    if (["rcdoctors","fathers"].includes(L.key) && state[L.key]){
      const who = attributorsOf(L.key);
      if (who.length){
        const sel = document.createElement("select");
        sel.className = "drs";
        sel.innerHTML = `<option value="">All attributors (${who.length})</option>` +
          who.map(w => `<option${pickedDoctor.value===w?" selected":""}>${w}</option>`).join("");
        sel.onchange = () => { pickedDoctor.value = sel.value; pickedDoctor.layer = L.key; renderText(); };
        el.appendChild(sel);
      } else {
        const none = document.createElement("div");
        none.className = "hint";
        none.textContent = "no attributors for this chapter";
        el.appendChild(none);
      }
    }
  }
  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = "up to 3 layers · first = background, second = text color, third = edge stripe";
  el.appendChild(hint);
}

function attributorOfText(text){
  const seg = (text||"").split(" | ")[1] || "";
  const m = seg.match(/^([\w' .-]+?)\s*(?:\(via|,|\s\(|:)/);
  return m ? (NAME_FIX[m[1].trim()] || m[1].trim()) : "";
}
function matchesPick(c, key){
  if (!pickedDoctor.value || key !== pickedDoctor.layer) return true;
  const a = attributorOfText(c.text);
  if (!a) return false;
  return a === pickedDoctor.value || pickedDoctor.value.startsWith(a) || a.startsWith(pickedDoctor.value.split(" (")[0]);
}

function renderText(){
  const el = document.getElementById("text");
  el.innerHTML = "";
  for (const v of VERSES){
    const p = document.createElement("p");
    p.className = "v";
    p.innerHTML = `<sup class="vnum">${v.v}</sup>`;
    const onCite = order.filter(k => state[k] && (CITATIONS[k]||[]).some(c => c.verse === v.v && matchesPick(c, k)));
    if (onCite.length){
      const bgc = BG[onCite[0]];
      const txtc = onCite.length > 1 ? TX[onCite[1]] : '';
      const stripes = onCite.slice(2);
      const shadow = stripes.length ? `box-shadow:${stripes.map((k,i)=>`inset -${5*(i+1)}px 0 0 ${BG[k]}`).join(',')};` : '';
      p.innerHTML += `<mark class="hl" style="background:${bgc};${txtc?`color:${txtc};font-weight:600;`:''}${shadow}">${v.text}</mark>`;
      p.style.cursor = "pointer";
      p.onclick = () => showDetail(v.v);
    } else p.innerHTML += v.text;
    el.appendChild(p);
  }
}

async function loadPassage(idx, src){
  const box = document.getElementById("passage-" + idx);
  if (!box || !src) return;
  box.textContent = "loading…";
  const m = src.match(/fathers[^#?]*\/L(\d+)/) || null;
  const vol = src.match(/fathers\/([^\/?#]+)/);
  try {
    if (!m || !vol) { box.textContent = "no passage preview available"; return; }
    const r = await fetch(`/api/passage/${vol[1]}/L${m[1]}`).then(x => x.json());
    if (r.error) { box.textContent = "no passage preview available"; return; }
    box.innerHTML = `<div class="passagecard">
      <div class="passagehead">${r.vol} · line ${r.line} · ref: ${r.ref}</div>
      <div class="passagesnippet">${r.snippet}</div>
      <a class="goto" target="_blank" href="${r.raw}">open the full raw source →</a>
    </div>`;
  } catch (e) { box.textContent = "passage preview unavailable"; }
}

function showDetail(v){
  const el = document.getElementById("citedetail");
  const all = [];
  for (const k of order){
    for (const c of (CITATIONS[k]||[])){
      if (c.verse !== v || !matchesPick(c, k)) continue;
      all.push({layer:k, ...c});
    }
  }
  el.innerHTML = `<h3>${CUR.book} ${CUR.chap}:${v} — ${all.length} citation${all.length>1?'s':''}</h3>`;
  for (const c of all){
    const d = document.createElement("div");
    d.className = "citem"; d.style.borderLeft = `3px solid ${BG[c.layer]}`;
    const ym = (c.text||"").match(/https:\/\/youtu\.be\/([A-Za-z0-9_-]{11})/);
    d.innerHTML = `<span class="who" style="color:${TX[c.layer]}">${(c.who&&c.who!=="src")?c.who:c.layer}</span>
      ${c.text.slice(0,130)}<br>
      <span class="passage" id="passage-${all.indexOf(c)}"></span><br>
      ${ym?`<a class="goto" target="_blank" href="https://www.youtube.com/watch?v=${ym[1]}">watch the video ▶</a> `:""}
      ${c.src?`<a class="goto" href="javascript:void(0)" onclick="loadPassage(${all.indexOf(c)},'${c.src}')">show the passage →</a>`:""}`;
    el.appendChild(d);
  }
}

window.addEventListener("hashchange", route);
loadBooks().then(route);
</script></body></html>
